<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinmap — Genogram Editor</title>
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<div class="app">
  <!-- top bar -->
  <header class="topbar" id="topbar" data-screen-label="editor">
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div><h1>Kinmap</h1><p>GENOGRAM EDITOR</p></div>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-tools">
      <button class="tbtn" data-act="new">New</button>
      <div class="tb-div"></div>
      <button class="tbtn" data-act="save"><span class="i">↓</span> Save</button>
      <button class="tbtn" data-act="open"><span class="i">↑</span> Open</button>
      <button class="tbtn" data-act="export"><span class="i">⬇</span> Export</button>
      <div class="tb-div"></div>
      <button class="tbtn primary" data-act="add"><span class="i">＋</span> Add member</button>
      <button class="tbtn" data-act="relate"><span class="i">⟂</span> Add relationship</button>
      <div class="tb-div"></div>
      <button class="tbtn" data-act="fit"><span class="i">⤢</span> Fit</button>
      <button class="tbtn" data-act="legend"><span class="i">⊞</span> Legend</button>
      <button class="tbtn" data-act="manage-labels">Manage labels</button>
      <button class="tbtn on" data-act="toggle-emo" id="toggle-emo-btn" title="Show/hide emotional ties"><span class="i">∿</span> Emotional ties</button>
    </div>
  </header>

  <div class="body">
    <!-- left rail -->
    <aside class="rail">
      <div class="rail-h"><h2>Family members</h2><span class="pcount" id="pcount">8</span></div>
      <div class="search-wrap"><input class="search" id="search" placeholder="Search members…" autocomplete="off"></div>
      <div class="mlist" id="mlist"></div>
    </aside>

    <!-- stage -->
    <section class="stage">
      <div class="stage-canvas" id="stage-canvas">
        <svg id="canvas"><g id="world"></g></svg>
        <div class="zoomctl">
          <button data-act="zout" title="Zoom out">−</button>
          <span class="zpct" id="zpct">100%</span>
          <button data-act="zin" title="Zoom in">＋</button>
        </div>
        <div class="editctl">
          <button class="tbtn" data-act="toggle-edit" id="toggle-edit-btn" title="Drag members to reorder within their row"><span class="i">⇄</span> Edit positions</button>
          <button class="tbtn" data-act="reset-all-pos" id="reset-pos-btn" title="Clear all manual positions"><span class="i">↺</span> Reset positions</button>
        </div>
        <div class="legend" id="legend"><div class="legend-body" id="legend-body"></div></div>
        <div class="toast" id="toast"></div>
      </div>
      <!-- bottom relationship builder (filled by app) -->
      <div class="relbar" id="relbar"></div>
    </section>

    <!-- right drawer (filled by app) -->
    <aside class="drawer" id="drawer"></aside>
  </div>
</div>

<!-- save genogram modal -->
<div class="modal-overlay" id="save-modal">
  <div class="modal">
    <h3>Save genogram</h3>
    <div class="fld" style="margin-bottom:20px">
      <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px">Name</label>
      <input class="inp" id="save-name-input" placeholder="e.g. Smith Family" autocomplete="off">
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-act="save-cancel">Cancel</button>
      <button class="btn primary" data-act="save-confirm">Save</button>
    </div>
  </div>
</div>

<!-- open genogram modal -->
<div class="modal-overlay" id="open-modal">
  <div class="modal" style="width:480px">
    <h3>Open genogram</h3>
    <div id="saves-list" style="margin:12px 0 20px;max-height:320px;overflow-y:auto"></div>
    <div class="modal-foot">
      <button class="btn ghost" data-act="open-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- new genogram confirmation modal -->
<div class="modal-overlay" id="new-modal">
  <div class="modal">
    <h3>Start a new genogram?</h3>
    <p>All current family data will be cleared. This cannot be undone.</p>
    <div class="modal-foot">
      <button class="btn ghost" data-act="new-cancel">Cancel</button>
      <button class="btn primary danger-primary" data-act="new-confirm">Start fresh</button>
    </div>
  </div>
</div>

<!-- export modal (filled by app: format / page-size / orientation) -->
<div class="modal-overlay" id="export-modal">
  <div class="modal" style="width:460px" id="export-modal-body"></div>
</div>

<!-- manage labels modal (filled by app: label registry list + add form) -->
<div class="modal-overlay" id="labels-modal">
  <div class="modal" style="width:460px" id="labels-modal-body"></div>
</div>

<!-- print-only rendering target; populated just before window.print(), hidden
     otherwise; everything else is hidden via @media print -->
<div id="print-area"></div>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="storage.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
